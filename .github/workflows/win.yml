name: Windows

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Windows 2025 [Release]
    runs-on: windows-2025

    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite"
      SCCACHE_GHA_ENABLED: "true"

    steps:
    - name: Enable long paths in Git
      shell: pwsh
      run: git config --system core.longpaths true

    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Set up MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Enable compiler cache
      uses: mozilla-actions/sccache-action@v0.0.11

    - name: Install Python Test Dependencies
      run: python -m pip install pytest

    - name: Get vcpkg revision
      shell: pwsh
      run: |
        $rev = git -C C:/vcpkg rev-parse HEAD
        "VCPKG_REV=$rev" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Restore vcpkg binary cache
      id: vcpkg-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ github.workspace }}/.vcpkg-cache
        key: vcpkg-windows-release-${{ env.VCPKG_REV }}-${{ hashFiles('cmake/triplets/x64-windows-release.cmake') }}
        restore-keys: |
          vcpkg-windows-release-${{ env.VCPKG_REV }}-

    - name: Install GMP, MPFR and Cairo with vcpkg
      shell: pwsh
      run: |
        & C:/vcpkg/vcpkg.exe install gmp:x64-windows-release mpfr:x64-windows-release cairo:x64-windows-release --host-triplet=x64-windows-release --overlay-triplets="$env:GITHUB_WORKSPACE/cmake/triplets"

    - name: Save vcpkg binary cache
      if: steps.vcpkg-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ github.workspace }}/.vcpkg-cache
        key: vcpkg-windows-release-${{ env.VCPKG_REV }}-${{ hashFiles('cmake/triplets/x64-windows-release.cmake') }}

    - name: Create Build Environment
      run: cmake -E make_directory ${{ runner.workspace }}/build

    - name: Configure CMake
      working-directory: ${{ runner.workspace }}/build
      run: cmake $env:GITHUB_WORKSPACE -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-release -DVCPKG_HOST_TRIPLET=x64-windows-release -DX_VCPKG_APPLOCAL_DEPS_SERIALIZED=ON -DVCPKG_USE_LEGACY_APPLOCAL=ON -DWARNINGS_AS_ERRORS=ON -DPYTHON_ENFORCE_TESTS=ON -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

    - name: Build
      working-directory: ${{ runner.workspace }}/build
      run: cmake --build . --parallel --target everything

    - name: Test C++
      working-directory: ${{ runner.workspace }}/build
      run: ctest -LE python -V --timeout 60

    - name: Test Python
      working-directory: ${{ runner.workspace }}/build
      run: ctest -L python -V --timeout 60

    - name: Install Ariadne Kernel
      working-directory: ${{ runner.workspace }}/build
      run: cmake --install . --prefix "${{ runner.workspace }}/install"

    - name: Prepare C++ Function Tutorial
      shell: pwsh
      run: cmake -E copy_directory "$env:GITHUB_WORKSPACE/tutorials/tutorial_function" "${{ runner.workspace }}/tutorial_function"

    - name: Check C++ Function Tutorial
      shell: pwsh
      working-directory: ${{ runner.workspace }}/tutorial_function
      run: |
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ runner.workspace }}/install" -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-release -DVCPKG_HOST_TRIPLET=x64-windows-release -DX_VCPKG_APPLOCAL_DEPS_SERIALIZED=ON -DVCPKG_USE_LEGACY_APPLOCAL=ON -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
        cmake --build build --parallel
        $env:PATH = "${{ runner.workspace }}\install\bin;C:\vcpkg\installed\x64-windows-release\bin;$env:PATH"
        & ".\build\tutorial_function.exe"

    - name: Check Python Function Tutorial
      shell: pwsh
      working-directory: ${{ github.workspace }}/python/tutorials
      run: |
        $env:PYTHONPATH = "${{ runner.workspace }}\build\python"
        python tutorial_function.py

    - name: Prepare C++ Geometry Tutorial
      shell: pwsh
      run: cmake -E copy_directory "$env:GITHUB_WORKSPACE/tutorials/tutorial_geometry" "${{ runner.workspace }}/tutorial_geometry"

    - name: Check C++ Geometry Tutorial
      shell: pwsh
      working-directory: ${{ runner.workspace }}/tutorial_geometry
      run: |
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ runner.workspace }}/install" -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-release -DVCPKG_HOST_TRIPLET=x64-windows-release -DX_VCPKG_APPLOCAL_DEPS_SERIALIZED=ON -DVCPKG_USE_LEGACY_APPLOCAL=ON -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
        cmake --build build --parallel
        $env:PATH = "${{ runner.workspace }}\install\bin;C:\vcpkg\installed\x64-windows-release\bin;$env:PATH"
        & ".\build\tutorial_geometry.exe"

    - name: Check Python Geometry Tutorial
      shell: pwsh
      working-directory: ${{ github.workspace }}/python/tutorials
      run: |
        $env:PYTHONPATH = "${{ runner.workspace }}\build\python"
        python tutorial_geometry.py

    - name: Prepare C++ IO Tutorial
      shell: pwsh
      run: cmake -E copy_directory "$env:GITHUB_WORKSPACE/tutorials/tutorial_io" "${{ runner.workspace }}/tutorial_io"

    - name: Check C++ IO Tutorial
      shell: pwsh
      working-directory: ${{ runner.workspace }}/tutorial_io
      run: |
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ runner.workspace }}/install" -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-release -DVCPKG_HOST_TRIPLET=x64-windows-release -DX_VCPKG_APPLOCAL_DEPS_SERIALIZED=ON -DVCPKG_USE_LEGACY_APPLOCAL=ON -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
        cmake --build build --parallel
        $env:PATH = "${{ runner.workspace }}\install\bin;C:\vcpkg\installed\x64-windows-release\bin;$env:PATH"
        & ".\build\tutorial_io.exe"

    - name: Check Python IO Tutorial
      shell: pwsh
      working-directory: ${{ github.workspace }}/python/tutorials
      run: |
        $env:PYTHONPATH = "${{ runner.workspace }}\build\python"
        python tutorial_io.py

    - name: Prepare C++ Solving Tutorial
      shell: pwsh
      run: cmake -E copy_directory "$env:GITHUB_WORKSPACE/tutorials/tutorial_solving" "${{ runner.workspace }}/tutorial_solving"

    - name: Check C++ Solving Tutorial
      shell: pwsh
      working-directory: ${{ runner.workspace }}/tutorial_solving
      run: |
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ runner.workspace }}/install" -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-release -DVCPKG_HOST_TRIPLET=x64-windows-release -DX_VCPKG_APPLOCAL_DEPS_SERIALIZED=ON -DVCPKG_USE_LEGACY_APPLOCAL=ON -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
        cmake --build build --parallel
        $env:PATH = "${{ runner.workspace }}\install\bin;C:\vcpkg\installed\x64-windows-release\bin;$env:PATH"
        & ".\build\tutorial_solving.exe"

    - name: Check Python Solving Tutorial
      shell: pwsh
      working-directory: ${{ github.workspace }}/python/tutorials
      run: |
        $env:PYTHONPATH = "${{ runner.workspace }}\build\python"
        python tutorial_solving.py

    - name: Prepare C++ Symbolic Tutorial
      shell: pwsh
      run: cmake -E copy_directory "$env:GITHUB_WORKSPACE/tutorials/tutorial_symbolic" "${{ runner.workspace }}/tutorial_symbolic"

    - name: Check C++ Symbolic Tutorial
      shell: pwsh
      working-directory: ${{ runner.workspace }}/tutorial_symbolic
      run: |
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ runner.workspace }}/install" -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-release -DVCPKG_HOST_TRIPLET=x64-windows-release -DX_VCPKG_APPLOCAL_DEPS_SERIALIZED=ON -DVCPKG_USE_LEGACY_APPLOCAL=ON -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
        cmake --build build --parallel
        $env:PATH = "${{ runner.workspace }}\install\bin;C:\vcpkg\installed\x64-windows-release\bin;$env:PATH"
        & ".\build\tutorial_symbolic.exe"

    - name: Check Python Symbolic Tutorial
      shell: pwsh
      working-directory: ${{ github.workspace }}/python/tutorials
      run: |
        $env:PYTHONPATH = "${{ runner.workspace }}\build\python"
        python tutorial_symbolic.py

    - name: Verify Uninstallation
      working-directory: ${{ runner.workspace }}/build
      run: cmake --build . --target uninstall
